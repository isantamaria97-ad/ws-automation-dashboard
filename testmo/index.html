<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testmo Runs · EVB</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-2: #13161f;
      --border: #2a2d3d;
      --text: #e4e6f0;
      --muted: #6b7280;
      --accent: #6366f1;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --gray: #6b7280;
      --blue: #3b82f6;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
    header h1 span { color: var(--accent); }
    .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    #last-updated { color: var(--muted); font-size: 12px; }
    .nav-link {
      color: var(--muted); font-size: 12px; text-decoration: none;
      padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
    }
    .nav-link:hover { color: var(--text); border-color: var(--accent); }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .run-picker {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .run-picker label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      font-weight: 600;
    }
    .run-picker select {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      min-width: 320px;
      cursor: pointer;
    }
    .run-picker select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .run-picker a.run-link {
      margin-left: auto;
      color: var(--accent);
      font-size: 12px;
      text-decoration: none;
      font-weight: 600;
    }
    .run-picker a.run-link:hover { text-decoration: underline; }

    section > h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .status-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 32px;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 36px;
      align-items: center;
    }
    .status-summary .completed-pct {
      font-size: 40px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.5px;
    }
    .status-summary .remaining-label {
      color: var(--muted);
      font-size: 15px;
      margin-top: 8px;
    }
    .status-legend {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-top: 28px;
    }
    .legend-row {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 14px;
      align-items: center;
    }
    .legend-swatch {
      width: 32px;
      height: 32px;
      border-radius: 4px;
    }
    .legend-text .count {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.1;
    }
    .legend-text .sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }
    .chart-wrap {
      position: relative;
      width: 100%;
      max-width: 340px;
      aspect-ratio: 1;
      margin: 0 auto;
    }
    .chart-wrap canvas { display: block; }
    .chart-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      flex-direction: column;
    }
    .chart-center .big { font-size: 28px; font-weight: 700; }
    .chart-center .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    #loading, #error, #empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 30vh;
      font-size: 16px;
      color: var(--muted);
    }
    #error { color: var(--red); }
    #content { display: none; }

    @media (max-width: 860px) {
      .status-panel { grid-template-columns: 1fr; gap: 24px; padding: 24px; }
      .chart-wrap { max-width: 280px; }
    }
    @media (max-width: 768px) {
      header { padding: 14px 16px; }
      main   { padding: 20px 16px; gap: 20px; }
      .run-picker select { min-width: 100%; }
      .run-picker a.run-link { margin-left: 0; }
    }
  </style>
</head>
<body>

<header>
  <h1>Testmo Runs · <span>EVB</span></h1>
  <div class="header-right">
    <a class="nav-link" href="../">← Automation dashboard</a>
    <span id="last-updated">Loading…</span>
  </div>
</header>

<div id="loading">Fetching run data…</div>
<div id="error" style="display:none"></div>
<div id="empty" style="display:none">No runs configured. Set TESTMO_RUN_IDS or TESTMO_GROUP_ID in the workflow.</div>

<main id="content">

  <section class="run-picker">
    <label for="run-select">Run</label>
    <select id="run-select"></select>
    <a id="run-link" class="run-link" href="#" target="_blank" rel="noopener">Open in Testmo ↗</a>
  </section>

  <section>
    <h2>Run status</h2>
    <div class="status-panel">
      <div class="status-summary">
        <div class="completed-pct" id="completed-pct">0% completed</div>
        <div class="remaining-label" id="remaining-label">0 of 0 remaining</div>
        <div class="status-legend" id="legend"></div>
      </div>
      <div class="chart-wrap">
        <canvas id="status-pie"></canvas>
        <div class="chart-center">
          <div class="big" id="chart-center-pct">0%</div>
          <div class="sub">completed</div>
        </div>
      </div>
    </div>
  </section>

</main>

<script>
  // Mirrors the Testmo run modal: only 4 explicit buckets visible.
  // Anything not in these buckets (untested, skipped, never-recorded) is
  // collapsed into the implicit "remaining" slice in the donut.
  const STATUSES = [
    { key: 'passed',  label: 'Passed',  color: '#5cb85c' },
    { key: 'failed',  label: 'Failed',  color: '#d9534f' },
    { key: 'retest',  label: 'Retest',  color: '#f0ad4e' },
    { key: 'blocked', label: 'Blocked', color: '#9e9e9e' },
  ];
  const REMAINING_COLOR = '#3f4452';

  let chart = null;
  let runs = [];

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function pct(n, total) {
    return total ? ((n / total) * 100).toFixed(1) + '%' : '0%';
  }

  async function main() {
    const loading = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const emptyEl = document.getElementById('empty');
    const content = document.getElementById('content');
    try {
      const resp = await fetch('data.json?_=' + Date.now());
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const d = await resp.json();

      loading.style.display = 'none';
      document.getElementById('last-updated').textContent =
        'Updated ' + new Date(d.lastUpdated).toLocaleString();

      runs = d.runs || [];
      if (!runs.length) {
        emptyEl.style.display = 'flex';
        return;
      }

      content.style.display = 'flex';
      const sel = document.getElementById('run-select');
      sel.innerHTML = runs.map((r, i) =>
        `<option value="${i}">${esc(r.name || ('Run ' + r.id))} · #${r.id}</option>`
      ).join('');
      sel.addEventListener('change', () => render(runs[+sel.value]));
      render(runs[0]);
    } catch (err) {
      loading.style.display = 'none';
      errorEl.style.display = 'flex';
      errorEl.textContent = 'Could not load data.json — ' + err.message;
    }
  }

  function render(run) {
    document.getElementById('run-link').href = run.url || '#';

    const total = run.total || 0;
    const tracked = STATUSES.reduce((sum, s) => sum + (run[s.key] || 0), 0);
    const completed = tracked;
    const remaining = Math.max(0, total - completed);
    const completedPct = total ? Math.round((completed / total) * 100) : 0;

    document.getElementById('completed-pct').textContent = completedPct + '% completed';
    document.getElementById('remaining-label').textContent = `${remaining} of ${total} remaining`;
    document.getElementById('chart-center-pct').textContent = completedPct + '%';

    renderLegend(run, total);
    renderPie(run, total, remaining);
  }

  function renderLegend(run, total) {
    document.getElementById('legend').innerHTML = STATUSES.map(s => {
      const v = run[s.key] || 0;
      const p = total ? Math.round((v / total) * 100) : 0;
      return `<div class="legend-row">
        <div class="legend-swatch" style="background:${s.color}"></div>
        <div class="legend-text">
          <div class="count">${v} ${s.label}</div>
          <div class="sub">${p}% set to ${s.label}</div>
        </div>
      </div>`;
    }).join('');
  }

  function renderPie(run, total, remaining) {
    const labels = STATUSES.map(s => s.label).concat(['Remaining']);
    const colors = STATUSES.map(s => s.color).concat([REMAINING_COLOR]);
    const values = STATUSES.map(s => run[s.key] || 0).concat([remaining]);
    // Show a faint full ring when total is 0 so the donut is never invisible.
    if (!total) { values.fill(0); values[values.length - 1] = 1; }

    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('status-pie'), {
      type: 'doughnut',
      data: { labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }] },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '62%',
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                if (!total) return '';
                const v = ctx.parsed;
                return `${ctx.label}: ${v} (${pct(v, total)})`;
              }
            }
          }
        },
      },
    });
  }

  main();
</script>
</body>
</html>
