name: Update Dashboard Data

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours
  workflow_dispatch:          # manual trigger from Actions tab

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Verify required secrets are present
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TESTMO_API_TOKEN: ${{ secrets.TESTMO_API_TOKEN }}
        run: |
          fail=0
          for var in JIRA_EMAIL JIRA_API_TOKEN TESTMO_API_TOKEN; do
            len="${!var}"; len="${#len}"
            echo "  $var length: $len"
            if [ "$len" -eq 0 ]; then
              echo "::error::Secret $var is empty. Add it under Settings → Secrets and variables → Actions → Secrets (NOT Variables)."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]

      - name: Fetch Jira + Testmo data
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TESTMO_API_TOKEN: ${{ secrets.TESTMO_API_TOKEN }}
          TESTMO_PROJECT_ID: ${{ vars.TESTMO_PROJECT_ID || '9' }}
          TESTMO_AUTOMATION_SOURCE_ID: ${{ vars.TESTMO_AUTOMATION_SOURCE_ID || '17' }}
          TESTMO_RUN_NAME_PATTERN: ${{ vars.TESTMO_RUN_NAME_PATTERN || '^CL.*B2B Web' }}
          TESTMO_SCOPE_FOLDER_ID: ${{ vars.TESTMO_SCOPE_FOLDER_ID || '717' }}
          OUTPUT_PATH: data.json
        run: python3 scripts/fetch_data.py

      - name: Commit updated data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore: update dashboard data [skip ci]"
          git push
