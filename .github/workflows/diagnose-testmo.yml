name: Diagnose Testmo Fields
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Check case tags endpoints
        env:
          TESTMO_API_TOKEN: ${{ secrets.TESTMO_API_TOKEN }}
        run: |
          echo "=== CASE 114304 TAGS ==="
          curl -s -H "Authorization: Bearer $TESTMO_API_TOKEN" \
            "https://applydigital.testmo.net/api/v1/projects/44/cases/114304/tags"

          echo ""
          echo "=== CASES WITH include[]=tags ==="
          curl -s -H "Authorization: Bearer $TESTMO_API_TOKEN" \
            "https://applydigital.testmo.net/api/v1/projects/44/cases?page=1&include[]=tags" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result',d); [print(c['id'], c.get('tags')) for c in r[:5]]"

          echo ""
          echo "=== CASES WITH with_tags=1 ==="
          curl -s -H "Authorization: Bearer $TESTMO_API_TOKEN" \
            "https://applydigital.testmo.net/api/v1/projects/44/cases?page=1&with_tags=1" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result',d); [print(c['id'], c.get('tags')) for c in r[:5]]"

          echo ""
          echo "=== CASES DEFAULT (check tags field) ==="
          curl -s -H "Authorization: Bearer $TESTMO_API_TOKEN" \
            "https://applydigital.testmo.net/api/v1/projects/44/cases?page=1" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result',d); [print(c['id'], repr(c.get('tags','NO_FIELD'))) for c in r[:5]]"
