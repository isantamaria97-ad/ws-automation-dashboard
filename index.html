<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automation Dashboard · Whitestuff</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3d;
      --text: #e4e6f0;
      --muted: #6b7280;
      --accent: #6366f1;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --blue: #3b82f6;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
    header h1 span { color: var(--accent); }
    #last-updated { color: var(--muted); font-size: 12px; }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    section > h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .card .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .card .value {
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
    }
    .card .value.green  { color: var(--green); }
    .card .value.yellow { color: var(--yellow); }
    .card .value.red    { color: var(--red); }
    .card .value.blue   { color: var(--blue); }
    .card .value.accent { color: var(--accent); }

    .charts-row {
      display: flex;
      gap: 20px;
      align-items: stretch;
    }
    .charts-row > .chart-box { min-width: 0; }
    .chart-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .chart-box h3 {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .chart-wrap {
      position: relative;
      height: 260px;
    }
    .chart-wrap canvas { display: block; }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: #13161f; border-bottom: 1px solid var(--border); }
    th {
      padding: 10px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
    }
    td {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.025); }

    .key-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
    }
    .key-link:hover { text-decoration: underline; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge.todo     { background: rgba(107,114,128,.2); color: #9ca3af; }
    .badge.progress { background: rgba(59,130,246,.2);  color: #60a5fa; }
    .badge.done     { background: rgba(34,197,94,.2);   color: #4ade80; }
    .badge.other    { background: rgba(107,114,128,.2); color: #9ca3af; }

    .run-bar {
      display: flex;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      min-width: 80px;
      background: var(--border);
    }
    .run-bar span { display: block; }

    #loading, #error {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40vh;
      font-size: 16px;
      color: var(--muted);
    }
    #error { color: var(--red); }
    #content { display: none; }

    .accordion-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .accordion-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      cursor: pointer;
      user-select: none;
      transition: background .15s;
    }
    .accordion-header:hover { background: rgba(255,255,255,.03); }
    .accordion-chevron {
      font-size: 11px;
      color: var(--muted);
      transition: transform .2s;
      flex-shrink: 0;
    }
    .accordion-item.open .accordion-chevron { transform: rotate(90deg); }
    .accordion-title { font-weight: 600; font-size: 14px; flex: 1; }
    .accordion-meta  { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .accordion-pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .acc-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    }
    .accordion-body { display: none; border-top: 1px solid var(--border); }
    .accordion-item.open .accordion-body { display: block; }
    .accordion-body table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .accordion-body th {
      padding: 9px 16px; text-align: left; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
      background: #13161f; border-bottom: 1px solid var(--border);
    }
    .accordion-body td { padding: 9px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .accordion-body tr:last-child td { border-bottom: none; }
    .accordion-body tr:hover td { background: rgba(255,255,255,.02); }

    @media (max-width: 768px) {
      header { padding: 14px 16px; }
      main   { padding: 20px 16px; gap: 24px; }
      .charts-row { flex-direction: column; }
    }
  </style>
</head>
<body>

<header>
  <h1>Automation Dashboard · <span>Whitestuff</span></h1>
  <div style="display:flex;align-items:center;gap:12px">
    <a href="testmo/" style="color:var(--muted);font-size:12px;text-decoration:none;padding:6px 10px;border:1px solid var(--border);border-radius:6px"
       onmouseover="this.style.color='var(--text)';this.style.borderColor='var(--accent)'"
       onmouseout="this.style.color='var(--muted)';this.style.borderColor='var(--border)'">
      Testmo Runs →
    </a>
    <span id="last-updated">Loading…</span>
  </div>
</header>

<div id="loading">Loading dashboard data…</div>
<div id="error" style="display:none"></div>

<main id="content">

  <section>
    <h2>Automation Coverage · <span id="scope-folder" style="color:var(--text);text-transform:none;letter-spacing:normal;font-weight:600"></span></h2>
    <div class="cards" id="coverage-cards"></div>
    <div class="charts-row" style="margin-top:14px">
      <div class="chart-box" style="width:280px;flex-shrink:0">
        <h3>Coverage distribution</h3>
        <div class="chart-wrap"><canvas id="coverage-donut"></canvas></div>
      </div>
      <div class="chart-box" style="flex:1">
        <h3>By feature</h3>
        <div class="table-wrap" style="border:none">
          <table>
            <thead>
              <tr>
                <th>Feature</th>
                <th style="width:35%">Coverage</th>
                <th style="text-align:right">Automated</th>
                <th style="text-align:right">Not automated</th>
                <th style="text-align:right">Unclassified</th>
                <th style="text-align:right">Total</th>
              </tr>
            </thead>
            <tbody id="coverage-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2>Automation Runs · <span id="scope-runs" style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:normal"></span></h2>
    <div class="cards" id="runs-cards"></div>
    <div class="charts-row" style="margin-top:14px">
      <div class="chart-box" style="flex:1">
        <h3>Recent runs (last 10)</h3>
        <div class="chart-wrap"><canvas id="runs-bar"></canvas></div>
      </div>
    </div>
  </section>

  <section>
    <h2>Test Runs</h2>
    <div id="runs-accordion-loading" style="color:var(--muted);font-size:13px;padding:12px 0">Loading runs…</div>
    <div id="runs-accordion" style="display:none;display:flex;flex-direction:column;gap:8px"></div>
  </section>

</main>

<script>
  const STATUS_CLASS = { 'To Do': 'todo', 'In Progress': 'progress', 'Done': 'done' };
  // Jira returns status names in English; map them to Spanish for display.
  const tr = s => s;

  function badge(text, cls) {
    return `<span class="badge ${cls || 'other'}">${text}</span>`;
  }
  function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function card(label, value, colorClass) {
    return `<div class="card"><div class="label">${label}</div><div class="value ${colorClass || ''}">${value}</div></div>`;
  }
  function runBar(passed, failed, pending, total) {
    if (!total) return '<div class="run-bar"></div>';
    const pct = n => ((n / total) * 100).toFixed(1) + '%';
    return `<div class="run-bar">
      <span style="width:${pct(passed)};background:#22c55e"></span>
      <span style="width:${pct(failed)};background:#ef4444"></span>
      <span style="width:${pct(pending)};background:#6b7280"></span>
    </div>`;
  }
  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function trunc(str, max) {
    return str.length > max ? str.slice(0, max) + '…' : str;
  }

  const STATUS_CFG = {
    2: { label: 'Passed',   color: '#22c55e' },
    3: { label: 'Failed',   color: '#ef4444' },
    4: { label: 'Retest',   color: '#f0ad4e' },
    5: { label: 'Blocked',  color: '#9e9e9e' },
    6: { label: 'Skipped',  color: '#8b5cf6' },
    1: { label: 'Untested', color: '#3b82f6' },
  };

  async function main() {
    const loading = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const content = document.getElementById('content');
    try {
      const [resp, testmoResp] = await Promise.all([
        fetch('data.json?_=' + Date.now()),
        fetch('testmo/data.json?_=' + Date.now()),
      ]);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const d = await resp.json();
      const testmoData = testmoResp.ok ? await testmoResp.json() : null;

      loading.style.display = 'none';
      content.style.display = 'block';
      document.getElementById('last-updated').textContent =
        'Updated ' + new Date(d.lastUpdated).toLocaleString('en-GB');

      renderCoverage(d.testmo);
      renderRuns(d.testmo);
      renderCharts(d);
      renderAccordion(testmoData);
    } catch (err) {
      loading.style.display = 'none';
      errorEl.style.display = 'flex';
      errorEl.textContent = 'Could not load data.json — ' + err.message;
    }
  }

  function renderAccordion(testmoData) {
    const loadingEl = document.getElementById('runs-accordion-loading');
    const accordion = document.getElementById('runs-accordion');

    if (!testmoData || !testmoData.runs || !testmoData.runs.length) {
      loadingEl.textContent = 'No run data available.';
      return;
    }

    loadingEl.style.display = 'none';
    accordion.style.display = 'flex';

    accordion.innerHTML = testmoData.runs.map((run, idx) => {
      const cases = run.cases || [];
      const counts = {};
      for (const c of cases) counts[c.statusId] = (counts[c.statusId] || 0) + 1;

      const pills = Object.entries(STATUS_CFG)
        .filter(([id]) => counts[id])
        .map(([id, cfg]) => `<span class="acc-pill" style="background:${cfg.color}22;color:${cfg.color}">
          <span style="width:6px;height:6px;border-radius:50%;background:${cfg.color};display:inline-block"></span>
          ${cfg.label} ${counts[id]}
        </span>`).join('');

      const date = run.created_at
        ? new Date(run.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
        : '';

      const deviceMatch = (run.name || '').match(/\(([^)]+)\)/);
      const deviceLabel = deviceMatch ? deviceMatch[1] : (run.config || '');
      const baseName = (run.name || '').replace(/\s*\([^)]*\)/, '').trim();
      const deviceBadge = deviceLabel
        ? `<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent)22;color:var(--accent);white-space:nowrap">${esc(deviceLabel)}</span>`
        : '';

      // Group cases by name prefix (part before " - "); fallback "Other"
      const groups = {};
      for (const c of cases) {
        const sep = (c.name || '').indexOf(' - ');
        const tag = sep > -1 ? c.name.slice(0, sep).trim() : 'Other';
        if (!groups[tag]) groups[tag] = [];
        groups[tag].push(c);
      }
      const sortedGroups = Object.entries(groups).sort(([a], [b]) =>
        a === 'Other' ? 1 : b === 'Other' ? -1 : a.localeCompare(b)
      );

      const makeRow = c => {
        const cfg = STATUS_CFG[c.statusId] || { label: c.status || 'Unknown', color: '#9ca3af' };
        const updated = c.updatedAt
          ? new Date(c.updatedAt).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })
          : '—';
        return `<tr>
          <td style="font-weight:500">${esc(c.name || 'Case #' + c.caseId)}</td>
          <td><span style="display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;background:${cfg.color}22;color:${cfg.color}">
            <span style="width:6px;height:6px;border-radius:50%;background:${cfg.color}"></span>${esc(cfg.label)}
          </span></td>
          <td style="color:var(--muted);white-space:nowrap">${updated}</td>
          <td style="text-align:right;color:var(--muted);font-variant-numeric:tabular-nums">#${c.caseId ?? '—'}</td>
        </tr>`;
      };

      const bodyContent = cases.length === 0
        ? `<table><tbody><tr><td colspan="4" style="color:var(--muted);text-align:center;padding:20px">No cases recorded</td></tr></tbody></table>`
        : sortedGroups.map(([tag, tagCases]) => `
          <div style="padding:8px 16px 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:var(--accent)0d;border-bottom:1px solid var(--border)">${esc(tag)} <span style="font-weight:400;color:var(--muted)">(${tagCases.length})</span></div>
          <table>
            <thead><tr>
              <th style="width:55%">Test case</th>
              <th>Status</th>
              <th>Updated</th>
              <th style="text-align:right">ID</th>
            </tr></thead>
            <tbody>${tagCases.map(makeRow).join('')}</tbody>
          </table>`).join('');

      return `<div class="accordion-item" data-idx="${idx}">
        <div class="accordion-header">
          <span class="accordion-chevron">▶</span>
          <span class="accordion-title">${esc(baseName || 'Run #' + run.id)}</span>
          ${deviceBadge}
          <div class="accordion-pills">${pills}</div>
          <span class="accordion-meta">${date} · ${cases.length} cases</span>
        </div>
        <div class="accordion-body">${bodyContent}</div>
      </div>`;
    }).join('');

    accordion.querySelectorAll('.accordion-header').forEach(header => {
      header.addEventListener('click', () => {
        const item = header.closest('.accordion-item');
        const isOpen = item.classList.contains('open');
        accordion.querySelectorAll('.accordion-item.open').forEach(el => el.classList.remove('open'));
        if (!isOpen) item.classList.add('open');
      });
    });
  }

  function coverageBar(automated, notAutomated, unclassified, total) {
    if (!total) return '<div class="run-bar"></div>';
    const pct = n => ((n / total) * 100).toFixed(1) + '%';
    return `<div class="run-bar">
      <span style="width:${pct(automated)};background:#22c55e"     title="Automated: ${automated}"></span>
      <span style="width:${pct(notAutomated)};background:#6b7280"  title="Not automated: ${notAutomated}"></span>
      <span style="width:${pct(unclassified)};background:#eab308"  title="Unclassified: ${unclassified}"></span>
    </div>`;
  }

  function renderCoverage({ scope, coverage }) {
    document.getElementById('scope-folder').textContent =
      (scope && scope.scopeFolderName) ? scope.scopeFolderName : 'todos los casos';

    const c = coverage;
    document.getElementById('coverage-cards').innerHTML =
      card('Total cases',     c.total, 'accent') +
      card('Automated',       c.automated + ' (' + c.automatedPct + '%)', c.automated > 0 ? 'green' : '') +
      card('Not automated',   c.notAutomated, '') +
      card('Unclassified',    c.unclassified, c.unclassified > 0 ? 'yellow' : '');

    const tbody = document.getElementById('coverage-tbody');
    const rows = c.byFolder || [];
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="color:var(--muted);text-align:center;padding:24px">No cases in scope</td></tr>';
      return;
    }
    let lastGroup = null;
    tbody.innerHTML = rows.map(f => {
      const groupHeader = f.group !== lastGroup
        ? `<tr><td colspan="6" style="background:#13161f;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:6px 16px">${esc(f.group)}</td></tr>`
        : '';
      lastGroup = f.group;
      const pct = f.total ? ((f.automated / f.total) * 100).toFixed(0) : 0;
      return groupHeader + `<tr>
        <td style="font-weight:600">${esc(f.name)}</td>
        <td>${coverageBar(f.automated, f.notAutomated, f.unclassified, f.total)}</td>
        <td style="text-align:right;color:var(--green);font-weight:600">${f.automated}</td>
        <td style="text-align:right;color:var(--muted)">${f.notAutomated}</td>
        <td style="text-align:right;color:${f.unclassified ? 'var(--yellow)' : 'var(--muted)'}">${f.unclassified}</td>
        <td style="text-align:right;font-weight:600">${f.total}</td>
      </tr>`;
    }).join('');
  }

  function renderRuns({ scope, runs }) {
    const passRateClass = runs.passRate >= 95 ? 'green' : runs.passRate >= 80 ? 'yellow' : 'red';
    document.getElementById('runs-cards').innerHTML =
      card('Total runs',     runs.total, 'accent') +
      card('Last passed',   runs.latestPassed, 'green') +
      card('Last failed',   runs.latestFailed, runs.latestFailed > 0 ? 'red' : '') +
      card('Pass rate',     runs.passRate + '%', passRateClass);

    if (scope) {
      const bits = [];
      if (scope.automationSourceId) bits.push(`source ${scope.automationSourceId}`);
      if (scope.runNamePattern)     bits.push(`name ~ /${scope.runNamePattern}/i`);
      document.getElementById('scope-runs').textContent = bits.length ? bits.join(' · ') : '';
    }

  }

  function renderCharts(d) {
    // Coverage donut
    const cov = d.testmo.coverage;
    new Chart(document.getElementById('coverage-donut'), {
      type: 'doughnut',
      data: {
        labels: ['Automated', 'Not automated', 'Unclassified'],
        datasets: [{
          data: [cov.automated, cov.notAutomated, cov.unclassified],
          backgroundColor: ['#22c55e', '#6b7280', '#eab308'],
          borderWidth: 0, hoverOffset: 6,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { color: '#9ca3af', font: { size: 12 }, padding: 12 } } },
        cutout: '62%',
      },
    });

    // Runs bar
    const runs = (d.testmo.runs.recent || []).slice().reverse();
    new Chart(document.getElementById('runs-bar'), {
      type: 'bar',
      data: {
        labels: runs.map(r => trunc(r.name, 28)),
        datasets: [
          { label: 'Passed',  data: runs.map(r => r.passed),  backgroundColor: '#22c55e' },
          { label: 'Failed',  data: runs.map(r => r.failed),  backgroundColor: '#ef4444' },
          { label: 'Pending', data: runs.map(r => r.pending), backgroundColor: '#6b7280' },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { stacked: true, ticks: { color: '#9ca3af', font: { size: 11 } }, grid: { color: '#2a2d3d' } },
          y: { stacked: true, ticks: { color: '#9ca3af', font: { size: 11 } }, grid: { color: '#2a2d3d' } },
        },
        plugins: { legend: { labels: { color: '#9ca3af', font: { size: 12 } } } },
      },
    });
  }

  main();
</script>
</body>
</html>
